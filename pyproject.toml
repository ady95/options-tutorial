[project]
name = "optlab"
version = "0.1.0"
description = "AI로 코스피200 위클리옵션 분석·자동매매 따라하기 — 예제 코드"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "requests>=2.31",
    "websockets>=12",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pyarrow>=14",
]

[project.optional-dependencies]
rl = ["gymnasium>=0.29", "stable-baselines3>=2.3"]
db = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
