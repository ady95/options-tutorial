# 실행 모드: replay | live  (live도 주문은 가상체결 엔진으로만 처리)
mode: replay
data_dir: data_samples/synthetic
risk_free_rate: 0.03
strategy:                 # 8장 시그널 엔진(optlab.strategy.signal.StrategyConfig)
  horizon_min: 15         # 보유 기간(분): 5 | 15 | 30
  atm_range: 3            # ATM ± N 행사가만 후보
  max_age_sec: 10         # 마지막 호가 이후 경과 시간 상한(초)
  max_spread_ratio: 0.2   # (매도-매수)/중간가 상한
  min_premium: 0.2        # 중간가 하한(포인트)
  fee_rate: 0.001         # 수수료(거래대금 대비, 한쪽) — 가정치. 자신의 계좌 조건으로 바꾼다
  min_edge_points: 0.05   # 기대순손익 최소 우위(포인트) = 위험완충
  iv_shocks: [-0.1, 0.0, 0.1]
  iv_weights: [0.25, 0.5, 0.25]
  direction_weight: 0.5   # 상승확률 반영 비율(0이면 방향 무시)
  exit_cutoff: "15:15"    # 청산 예정 시각이 이보다 늦으면 진입하지 않음
backtest:                 # 9장 이벤트 백테스트(optlab.backtest.engine.BacktestConfig). horizon·수수료는 strategy 값을 쓴다
  qty: 1                  # 신호 하나당 계약 수
  latency_sec: 0.5        # 결정 → 거래소 도착(가정치)
  entry_timeout_sec: 5    # 진입 주문 미체결 잔량 취소까지
  entry_ticks: 0          # 매수 지정가 = 매도호가 + N틱
  exit_timeout_sec: 5     # 청산 주문 재호가 간격
risk:                     # 10장 독립 위험관리(optlab.risk.limits.RiskConfig). AI 결정과 무관하게 강제
  max_contracts: 1        # 보유 + 미체결 매수 수량 합계 상한
  max_premium_krw: 2000000  # 주문 1건 프리미엄(지정가 × 수량 × 250,000원) 상한
  daily_loss_limit_krw: 1000000  # 당일 손실(실현 + 평가)이 이만큼이면 RISK_STOP
  max_net_delta: 1.0      # |Σ 델타 × 계약 수| 상한
  max_orders_per_min: 6   # 최근 60초 주문 수 상한(폭주 방지)
  max_rejects: 3          # 연속 주문 거부가 이만큼이면 RISK_STOP
  max_quote_age_sec: 3    # 수신 지연 상한(04-2절) → DATA_STALE
  heartbeat_sec: 5        # 선물 메시지가 이만큼 끊기면 DATA_STALE
  recover_sec: 10         # DATA_STALE 해제까지 연속 정상 시간
  no_entry_after: "15:00" # 이후 신규 진입 금지
  flatten_by: "15:10"     # 이 시각에 보유 포지션 강제 청산
  skip_expiry_day: true   # 만기일 신규 진입 금지(00-2절 안전 원칙). 만기일 기록 실습은 스크립트 옵션으로 허용
  kill_file: KILL         # 실행 폴더에 이 파일이 생기면 Kill Switch
run:                      # 11장 실시간 자동 모의매매(examples/ch11/paper_trade.py)
  product: KOSPI200_WEEKLY_THU   # Live 구독 상품(KOSPI200_WEEKLY_MON도 가능)
  chain_width: 9          # ATM ± N 행사가 옵션 호가 구독: 선물 2건 + 옵션 38건 = 40건(한 연결 한도)
  recenter_steps: 2       # ATM이 가운데 행사가에서 N칸 이상 멀어지면 구독 체인을 옮긴다
  decide_delay_sec: 2     # 매분 hh:mm:02에 결정(직전 분봉의 마지막 체결이 도착할 시간)
  run_dir: runs           # 감사 기록(audit.jsonl), 브로커 상태(broker.json), Live 수신 기록(ticks.db)
